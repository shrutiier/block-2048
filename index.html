<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0c160d" />
  <title>Block 2048</title>

<body data-screen="menu">
  <div id="crt">
    <div id="app">
      <div id="column" class="panel idle">
        <header id="topbar">
          <span class="game-name">block 2048</span>
          <span id="score" class="score">0</span>
        </header>
        <main id="stage"><canvas id="game" aria-label="Block 2048 game"></canvas></main>
        <footer id="bottombar">
          <span class="next"><canvas id="next" aria-label="Next ball"></canvas><span>next</span></span>
          <button id="pauseBtn" aria-label="Pause">pause</button>
        </footer>
      </div>
      <div id="overlay"></div>
    </div>
    <div class="crt-fx" aria-hidden="true"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
